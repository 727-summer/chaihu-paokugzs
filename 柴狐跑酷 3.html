<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>柴狐跑酷 · 角色选择</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft Yahei", sans-serif; }
  body {
    background: linear-gradient(160deg, #c4b5fd 0%, #fde047 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #wrap { position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 860px; }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0; background: rgba(93, 48, 180, 0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title { color: #fff700; font-size: 26px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 2px 2px 0 #5b21b6; }
  .subtitle { color: #fff; font-size: 14px; margin-bottom: 24px; opacity: 0.9; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 320px; }
  .role-card {
    background: #fff; border: 3px solid #d8b4fe; border-radius: 18px; padding: 14px 10px;
    text-align: center; cursor: pointer; transition: all .15s;
  }
  .role-card.selected { border-color: #fff700; background: #fffbe6; transform: scale(1.05); box-shadow: 0 6px 18px rgba(255,247,0,.55); }
  .role-avatar {
    width: 120px; height: 120px; margin: 0 auto 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff;
  }
  .role-name { font-size: 15px; font-weight: 700; color: #581c87; }
  .start-btn {
    margin-top: 26px; padding: 14px 44px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #9333ea, #fff700); color: #4c1d95;
    font-size: 18px; font-weight: 800; cursor: pointer; letter-spacing: 2px;
  }
  .start-btn:disabled { opacity: .4; cursor: not-allowed; }

  .result-box {
    background: #fff; border-radius: 22px; padding: 30px 26px; width: 80%; max-width: 300px;
    text-align: center;
  }
  .result-title { font-size: 22px; font-weight: 800; color: #6b21a8; margin-bottom: 10px; }
  .result-score { font-size: 18px; color: #7c3aed; margin-bottom: 4px; }
  .result-best { font-size: 14px; color: #a16207; margin-bottom: 20px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; }
  .btn { padding: 10px 22px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-purple { background: #9333ea; color: #fff; }
  .btn-yellow { background: #fff700; color: #4c1d95; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="roleSelect" class="overlay">
    <div class="title">选择你的角色</div>
    <div class="subtitle">柴狐跑酷 · 点屏幕跳跃越过障碍</div>
    <div class="role-grid" id="roleGrid"></div>
    <button id="startBtn" class="start-btn" disabled>开始游戏</button>
  </div>

  <div id="result" class="overlay hidden">
    <div class="result-box">
      <div class="result-title">游戏结束</div>
      <div class="result-score" id="finalScore">得分：0</div>
      <div class="result-best" id="bestScore">最高分：0</div>
      <div class="btn-row">
        <button class="btn btn-yellow" id="retryBtn">再来一局</button>
        <button class="btn btn-purple" id="backBtn">换角色</button>
      </div>
    </div>
  </div>

  <div id="win" class="overlay hidden">
    <div class="result-box">
      <div class="result-title">🎉 到达终点！</div>
      <div class="result-score" id="winScore">通关成功</div>
      <div class="result-best" id="winBest">太棒啦，你抵达了终点！</div>
      <div class="btn-row">
        <button class="btn btn-yellow" id="winRetry">再来一局</button>
        <button class="btn btn-purple" id="winBack">换角色</button>
      </div>
    </div>
  </div>
</div>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  const wrap = document.getElementById("wrap");
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener("resize", resize);

const state = {
  selectedRole: null,
  running: false,
  score: 0,
  best: Number(localStorage.getItem("py_best") || 0),
  speed: 3,
  gravity: 0.42,
  cleared: 0,
  level: 1,
  totalLevels: 1224,
  finalTarget: 12240,
  spawnTimer: 0,
  bonusTimer: 0,
  target: 10,
  finished: false,
  player: { x: 70, y: 0, w: 44, h: 44, vy: 0 },
  pillars: [],
  bonuses: [],
  frame: 0,
};

/* ================= 角色选择页 ================= */
const roleGrid = document.getElementById("roleGrid");
const startBtn = document.getElementById("startBtn");

ROLES.forEach((role) => {
  const card = document.createElement("div");
  card.className = "role-card";
  card.innerHTML = `
    <div class="role-avatar" style="background:transparent">
      ${role.img ? `<img src="${role.img}" style="width:110px;height:110px;object-fit:contain">` : role.name.slice(-1)}
    </div>
    <div class="role-name">${role.name}</div>`;
  card.onclick = () => {
    document.querySelectorAll(".role-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    state.selectedRole = role;
    startBtn.disabled = false;
  };
  roleGrid.appendChild(card);
});

/* 预加载角色图片 */
const roleImages = {};
ROLES.forEach(role => {
  if (role.img) {
    const im = new Image();
    im.src = role.img;
    roleImages[role.id] = im;
  }
});

startBtn.onclick = () => {
  document.getElementById("roleSelect").classList.add("hidden");
  startGame();
};
document.getElementById("retryBtn").onclick = () => {
  document.getElementById("result").classList.add("hidden");
  startGame();
};
document.getElementById("backBtn").onclick = () => {
  document.getElementById("result").classList.add("hidden");
  document.getElementById("roleSelect").classList.remove("hidden");
};

/* ================= 游戏逻辑 ================= */
function resetGame() {
  state.score = 0;
  state.speed = 3;
  state.frame = 0;
  state.cleared = 0;
  state.level = 1;
  state.spawnTimer = 0;
  state.bonusTimer = 0;
  state.finished = false;
  state.pillars = [];
  state.bonuses = [];
  state.player.y = H / 2;
  state.player.vy = 0;
}

function startGame() {
  resetGame();
  state.running = true;
  requestAnimationFrame(loop);
}

/* 点屏扇动向上（flap），不靠地面 */
function jump() {
  if (!state.running) return;
  state.player.vy = -8.5;
}
canvas.addEventListener("pointerdown", jump);

/* 上下柱：上柱黄色、下柱紫色，中间留洞；关卡越高洞越窄、柱越宽 */
function spawnPillar() {
  const lv = state.level;
  const gapH = Math.max(130, 200 - (lv - 1) * 0.02);
  const pw = Math.min(74, 58 + (lv - 1) * 0.02);
  const gapY = 110 + Math.random() * (H - gapH - 220);
  state.pillars.push({
    x: W + 20, w: pw, gapY, gapH, passed: false
  });
}

function spawnBonus() {
  const kinds = ["blueberry", "cake", "leaf"];
  state.bonuses.push({
    x: W + 20, y: 120 + Math.random() * (H - 240), r: 20,
    kind: kinds[Math.floor(Math.random() * kinds.length)], taken: false
  });
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  state.frame++;
  state.score += 0.02;
  /* 每穿过10根柱子升一关，共1224关，速度越来越快 */
  state.level = Math.min(state.totalLevels, 1 + Math.floor(state.cleared / 10));
  const lv = state.level;
  state.speed = Math.min(8, 3 + Math.min(5, (lv - 1) * 0.05));

  /* 玩家：重力下落，点屏上升 */
  const p = state.player;
  p.vy += state.gravity;
  p.y += p.vy;
  if (p.y < 0) { p.y = 0; p.vy = 0; }
  if (p.y > H - p.h) { p.y = H - p.h; p.vy = 0; }

  /* 关卡越高柱子出得越密 */
  state.spawnTimer--;
  if (state.spawnTimer <= 0) {
    spawnPillar();
    state.spawnTimer = Math.max(95, 170 - (lv - 1) * 0.02);
  }
  state.bonusTimer--;
  if (state.bonusTimer <= 0) {
    spawnBonus();
    state.bonusTimer = 320;
  }

  state.pillars.forEach(pl => {
    pl.x -= state.speed;
    /* 上柱（黄）：从顶到 gapY；下柱（紫）：从 gapY+gapH 到底 */
    const topBar = { x: pl.x, y: 0, w: pl.w, h: pl.gapY };
    const botBar = { x: pl.x, y: pl.gapY + pl.gapH, w: pl.w, h: H - pl.gapY - pl.gapH };
    if (rectHit(p, topBar) || rectHit(p, botBar)) gameOver();
    if (!pl.passed && pl.x + pl.w < p.x) {
      pl.passed = true;
      state.cleared += 1;
      state.score += 1;
      if (state.cleared >= state.finalTarget) win();
    }
  });
  state.pillars = state.pillars.filter(pl => pl.x > -80);

  state.bonuses.forEach(b => {
    b.x -= state.speed;
    const bx = { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 };
    if (!b.taken && rectHit(p, bx)) { b.taken = true; state.score += 3; }
  });
  state.bonuses = state.bonuses.filter(b => b.x > -40 && !b.taken);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#ddd0ff");
  g.addColorStop(0.5, "#f5f0ff");
  g.addColorStop(1, "#fff3a6");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 漂浮爱心：紫 / 黄 交替 */
  for (let i = 0; i < 6; i++) {
    const hx = 60 + i * 70;
    const hy = 100 + Math.sin(state.frame / 40 + i) * 30;
    const size = 26;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = i % 2 === 0 ? "#9333ea" : "#fde047";
    drawHeart(hx, hy, size);
  }
  ctx.globalAlpha = 1;

  /* 背景签名文字 */
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#6b21a8";
  ctx.font = "bold 26px Georgia, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Majiaqi&Dingchengxin", W / 2, H * 0.5);
  ctx.globalAlpha = 1;
}

function drawHeart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.75);
  ctx.bezierCurveTo(x - s * 1.05, y + s * 0.1, x - s * 0.7, y - s * 0.85, x, y - s * 0.2);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 0.85, x + s * 1.05, y + s * 0.1, x, y + s * 0.75);
  ctx.closePath();
  ctx.fill();
}

function drawPillars() {
  state.pillars.forEach(pl => {
    /* 上柱：黄色；下柱：紫色 */
    /* 上柱（顶 → gapY） */
    const g1 = ctx.createLinearGradient(pl.x, 0, pl.x + pl.w, 0);
    g1.addColorStop(0, "#fbbf24"); g1.addColorStop(1, "#fde047");
    ctx.fillStyle = g1;
    ctx.fillRect(pl.x, 0, pl.w, pl.gapY);
    /* 上柱底边黄边 */
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(pl.x, pl.gapY - 8, pl.w, 8);

    /* 下柱（gapY+gapH → 底） */
    const g2 = ctx.createLinearGradient(pl.x, 0, pl.x + pl.w, 0);
    g2.addColorStop(0, "#9333ea"); g2.addColorStop(1, "#c084fc");
    ctx.fillStyle = g2;
    ctx.fillRect(pl.x, pl.gapY + pl.gapH, pl.w, H - pl.gapY - pl.gapH);
    /* 下柱顶边紫边 */
    ctx.fillStyle = "#7e22ce";
    ctx.fillRect(pl.x, pl.gapY + pl.gapH, pl.w, 8);

    /* 柱身装饰球 */
    ctx.fillStyle = "#fff";
    for (let y = 28; y < pl.gapY - 20; y += 42) {
      ctx.beginPath(); ctx.arc(pl.x + pl.w / 2, y, 7, 0, Math.PI * 2); ctx.fill();
    }
    for (let y = pl.gapY + pl.gapH + 28; y < H - 20; y += 42) {
      ctx.beginPath(); ctx.arc(pl.x + pl.w / 2, y, 7, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function drawBonuses() {
  state.bonuses.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    const r = b.r;

    if (b.kind === "blueberry") {
      /* 蓝莓（略小，与蛋糕等比例） */
      const br = r * 0.85;
      ctx.beginPath(); ctx.arc(0, 0, br, 0, Math.PI * 2);
      ctx.fillStyle = "#4338ca"; ctx.fill();
      ctx.beginPath(); ctx.arc(-br*0.3, -br*0.35, br*0.3, 0, Math.PI * 2);
      ctx.fillStyle = "#818cf8"; ctx.fill();
      /* 顶部果蒂 */
      ctx.fillStyle = "#1e1b4b";
      ctx.beginPath(); ctx.moveTo(0, -br);
      ctx.lineTo(-br*0.25, -br*0.6); ctx.lineTo(0, -br*0.7);
      ctx.lineTo(br*0.25, -br*0.6); ctx.closePath(); ctx.fill();
    } else if (b.kind === "cake") {
      /* 小蛋糕 */
      /* 奶油顶 */
      ctx.beginPath();
      ctx.arc(0, -r*0.15, r*0.75, Math.PI, 0);
      ctx.fillStyle = "#fde68a"; ctx.fill();
      /* 杯身 */
      ctx.beginPath();
      ctx.moveTo(-r*0.7, -r*0.15);
      ctx.lineTo(-r*0.5, r*0.7);
      ctx.lineTo(r*0.5, r*0.7);
      ctx.lineTo(r*0.7, -r*0.15);
      ctx.closePath();
      ctx.fillStyle = "#f9a8d4"; ctx.fill();
      /* 樱桃 */
      ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.28, 0, Math.PI * 2);
      ctx.fillStyle = "#ef4444"; ctx.fill();
    } else if (b.kind === "leaf") {
      /* 银杏叶（使用实拍图，等比例） */
      if (GINKGO_IMG.complete) {
        const lw = r * 2.1, lh = r * 2.1 * (GINKGO_IMG.height / GINKGO_IMG.width);
        ctx.drawImage(GINKGO_IMG, -lw / 2, -lh / 2, lw, lh);
      }
    }
    ctx.restore();
  });
}

function drawPlayer() {
  const p = state.player;
  const role = state.selectedRole;
  /* 阴影 */
  ctx.fillStyle = "rgba(76,29,149,.12)";
  ctx.beginPath();
  ctx.ellipse(p.x + p.w / 2, p.y + p.h + 6, 18, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  if (role && roleImages[role.id]) {
    const im = roleImages[role.id];
    /* 游戏内角色放大，居中显示 */
    const size = 96;
    const dx = p.x + p.w / 2 - size / 2;
    const dy = p.y + p.h / 2 - size / 2;
    ctx.drawImage(im, dx, dy, size, size);
  } else {
    ctx.fillStyle = role ? role.color : "#9333ea";
    roundRect(p.x, p.y, p.w, p.h, 14);
    ctx.fill();
    ctx.fillStyle = "#fff700";
    roundRect(p.x + 8, p.y - 6, p.w - 16, 14, 7);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(p.x + 15, p.y + 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + 29, p.y + 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4c1d95";
    ctx.beginPath(); ctx.arc(p.x + 15, p.y + 23, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + 29, p.y + 23, 2.2, 0, Math.PI * 2); ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  ctx.fillStyle = "#4c1d95";
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("分数 " + Math.floor(state.score), 18, 36);
  ctx.font = "14px sans-serif";
  ctx.fillStyle = "#7c3aed";
  ctx.fillText("最高 " + state.best, 18, 58);
  ctx.fillText("第 " + state.level + "/" + state.totalLevels + " 关", 18, 80);
  ctx.fillText("进度 " + state.cleared + "/" + state.finalTarget, 18, 102);
}

function loop() {
  if (!state.running) return;
  update();
  drawBackground();
  drawPillars();
  drawBonuses();
  drawPlayer();
  drawHUD();
  requestAnimationFrame(loop);
}

function gameOver() {
  state.running = false;
  const final = Math.floor(state.score);
  if (final > state.best) {
    state.best = final;
    localStorage.setItem("py_best", state.best);
  }
  document.getElementById("finalScore").innerText = "得分：" + final;
  document.getElementById("bestScore").innerText = "最高分：" + state.best;
  setTimeout(() => document.getElementById("result").classList.remove("hidden"), 300);
}

function win() {
  state.running = false;
  state.finished = true;
  const final = Math.floor(state.score);
  if (final > state.best) {
    state.best = final;
    localStorage.setItem("py_best", state.best);
  }
  document.getElementById("winScore").innerText = "得分：" + final;
  document.getElementById("winBest").innerText = "连闯 " + state.totalLevels + " 关、穿过 " + state.finalTarget + " 根柱子，成功到达终点！";
  setTimeout(() => document.getElementById("win").classList.remove("hidden"), 300);
}

document.getElementById("winRetry").onclick = () => {
  document.getElementById("win").classList.add("hidden");
  startGame();
};
document.getElementById("winBack").onclick = () => {
  document.getElementById("win").classList.add("hidden");
  document.getElementById("roleSelect").classList.remove("hidden");
};

drawBackground();
</script>
</body>
</html>
